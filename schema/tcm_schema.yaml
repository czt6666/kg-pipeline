dataset: TCM
entity_types:
- name: 疾病
  prompt_line: 病名。例：感冒、消渴、胸痹、太阳病。
- name: 证候
  prompt_line: 对一组症状的病理概括，通常以"证"结尾或可补"证"字；疾病"辨证论治"下的分型标题一律为证候。例：风寒束表证、脾虚湿盛证。
- name: 症状
  prompt_line: 患者可感或医生可察的单一临床表现，含舌象、脉象。例：恶寒、口苦、苔白腻、脉浮紧。
- name: 治法功效
  prompt_line: 治疗原则或方药作用。证候后的"治法"与方药后的"功效"共用此类型，由关系名区分角色。例：辛温解表、健脾化湿、宣肺平喘。
- name: 方剂
  prompt_line: 例：麻黄汤、参苓白术散。
- name: 中药
  prompt_line: 例：麻黄、桂枝、炙甘草。
- name: 性味
  prompt_line: 每个性或味单独一个实体。例：辛、温、苦、寒。
- name: 脏腑经络
  prompt_line: 例：肺、脾、肾、足太阳膀胱经。
relations:
- name: 分型
  kind: relational
  domain: [疾病]
  range: [证候]
  description: 疾病分型为证候
  cues: 辨证论治下的分型标题
- name: 表现为
  kind: relational
  domain: [证候]
  range: [症状]
  description: 证候表现为症状
  cues: "\"症状：\"\"临床表现：\"\"症见\""
- name: 治法
  kind: relational
  domain: [证候]
  range: [治法功效]
  description: 证候的治法
  cues: "\"治法：\"\"治宜\"\"当以……法\""
- name: 方用
  kind: relational
  domain: [证候]
  range: [方剂]
  description: 证候所用方剂
  cues: "\"方药：\"\"代表方：\"\"某方主之\""
- name: 病位
  kind: relational
  domain: [证候]
  range: [脏腑经络]
  description: 证候的病位
  cues: "\"病位在\"\"病在\"\"病位主要在\""
- name: 组成
  kind: relational
  domain: [方剂]
  range: [中药]
  description: 方剂由中药组成
  cues: "\"组成：\"\"常用药：\"\"方中……\""
- name: 功效
  kind: relational
  domain: [方剂, 中药]
  range: [治法功效]
  description: 方剂或中药的功效
  cues: "\"功效：\"\"功能：\"\"本方……\"\"某药……以……\""
- name: 性味
  kind: relational
  domain: [中药]
  range: [性味]
  description: 中药的性味
  cues: "\"性味：\"\"味辛，性温\""
- name: 归经
  kind: relational
  domain: [中药]
  range: [脏腑经络]
  description: 中药归经
  cues: "\"归经：\"\"入肺经\""
- name: 主治
  kind: relational
  domain: [中药]
  range: [症状, 疾病, 证候]
  description: 中药主治
  cues: "\"主治：\"\"治……\"\"用于……\""
